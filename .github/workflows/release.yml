name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      OSFONTDIR: "/usr/share/fonts//"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX and Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
          quarto install tinytex --no-prompt
          fc-cache -f

      - name: Render Full Book
        run: quarto render

      - name: Render Mobile PDF
        run: quarto render --profile mobile --to pdf

      - name: Package Release Artifacts
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then version="1.0.0"; fi
          mkdir -p dist
          cp _book/*.pdf "dist/record-of-linji-farsi-${version}.pdf"
          cp _book/*.epub "dist/record-of-linji-farsi-${version}.epub"
          cp _book-mobile/*.pdf "dist/record-of-linji-farsi-${version}-mobile.pdf"
          tar -czf "dist/record-of-linji-farsi-${version}-html.tar.gz" -C _book .
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}.pdf
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}-mobile.pdf
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}.epub
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}-html.tar.gz
          generate_release_notes: true
          body: |
            نسخهٔ کامل برگردان فارسی کتاب **کارنامهٔ لین‌جی** (*The Record of Linji* / 臨濟錄).
            
            - **PDF رومیزی**: حروف‌چینی شده با لولاتک و قلم وزیرمتن همراه با متن چینی مصحح.
            - **PDF موبایل**: چیدمان بهینه‌شده برای نمایش در صفحهٔ گوشی‌های هوشمند.
            - **EPUB**: نسخهٔ استاندارد کتاب الکترونیک با جهت راست‌به‌چپ و فونت‌های تعبیه‌شده.
            
            پروانهٔ متن فارسی: CC BY-SA 4.0. پروانهٔ کدهای ابزار مخزن: MIT.
