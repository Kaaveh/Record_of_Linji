name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      OSFONTDIR: "/usr/share/fonts//"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX and Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
          quarto install tinytex --no-prompt
          fc-cache -f

      - name: Render Full Book
        run: quarto render

      - name: Render Mobile PDF
        run: quarto render --profile mobile --to pdf

      - name: Package Release Artifacts
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then version="1.0.0"; fi
          mkdir -p dist
          cp _book/*.pdf "dist/record-of-linji-farsi-${version}.pdf"
          cp _book/*.epub "dist/record-of-linji-farsi-${version}.epub"
          cp _book-mobile/*.pdf "dist/record-of-linji-farsi-${version}-mobile.pdf"
          tar -czf "dist/record-of-linji-farsi-${version}-html.tar.gz" -C _book .

          # Unversioned copies of the same four files. The versioned names are
          # what keeps an old release page meaningful; these are what
          # https://github.com/.../releases/latest/download/<name> resolves, so
          # kaavehdev.ir can fetch the current book without knowing the tag and
          # without a GitHub API call.
          cp "dist/record-of-linji-farsi-${version}.pdf"           dist/record-of-linji-farsi.pdf
          cp "dist/record-of-linji-farsi-${version}-mobile.pdf"    dist/record-of-linji-farsi-mobile.pdf
          cp "dist/record-of-linji-farsi-${version}.epub"          dist/record-of-linji-farsi.epub
          cp "dist/record-of-linji-farsi-${version}-html.tar.gz"   dist/record-of-linji-farsi-html.tar.gz

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Quarto emits only relative asset paths, so the bundle is relocatable.
      # Assert it, because kaavehdev.ir serves it from /translations/record-of-linji/
      # and a root-absolute path would 404 there only — silently, and only in
      # production.
      - name: Bundle is relocatable
        run: |
          if grep -rohE '(href|src)="/[^"]*"' _book --include='*.html' | grep -q .; then
            echo "Root-absolute asset paths found; this will break under /translations/record-of-linji/:"
            grep -rohE '(href|src)="/[^"]*"' _book --include='*.html' | sort -u | head
            exit 1
          fi
          echo "all asset paths are relative"

      # Quarto reuses a chapter's heading verbatim for the sidebar and for
      # <title>, and neither gets the inline processing the page body gets. A
      # heading carrying a note marker therefore ships as raw Markdown in the
      # nav of every page, and bidi scrambles it on screen. The nav is where it
      # always shows, so one grep covers it; see tools/anchors.py.
      - name: No Markdown leaks into the sidebar
        run: |
          if grep -rohE '</a>[^<]*\[\^[^]]*\]\([^)]*\)' _book --include='*.html' | grep -q .; then
            echo "Raw Markdown in the sidebar; a chapter heading is carrying inline markup:"
            grep -rohE '</a>[^<]*\[\^[^]]*\]\([^)]*\)' _book --include='*.html' | sort -u | head
            exit 1
          fi
          echo "no Markdown in the sidebar"

      - uses: softprops/action-gh-release@v2
        with:
          # A tag carrying a suffix (v1.0.2-rc.1) is a pre-release, which makes
          # it a free rehearsal: GitHub resolves `latest` to the newest
          # *non*-prerelease, so the deploy hook fires and kaavehdev.ir
          # rebuilds, but the site keeps serving the previous release. The
          # action does not infer this from the tag on its own.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}.pdf
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}-mobile.pdf
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}.epub
            dist/record-of-linji-farsi-${{ steps.name.outputs.version }}-html.tar.gz
            dist/record-of-linji-farsi.pdf
            dist/record-of-linji-farsi-mobile.pdf
            dist/record-of-linji-farsi.epub
            dist/record-of-linji-farsi-html.tar.gz
          generate_release_notes: true
          body: |
            نسخهٔ کامل برگردان فارسی کتاب **سخنان لین‌جی** (*The Record of Linji* / 臨濟錄).
            
            - **PDF رومیزی**: حروف‌چینی شده با لولاتک و قلم وزیرمتن همراه با متن چینی مصحح.
            - **PDF موبایل**: چیدمان بهینه‌شده برای نمایش در صفحهٔ گوشی‌های هوشمند.
            - **EPUB**: نسخهٔ استاندارد کتاب الکترونیک با جهت راست‌به‌چپ و فونت‌های تعبیه‌شده.
            
            پروانهٔ متن فارسی: CC BY-SA 4.0. پروانهٔ کدهای ابزار مخزن: MIT.

      # Rebuild kaavehdev.ir, which fetches releases/latest/download/ — so this
      # has to run *after* the assets above are attached, or the site builds
      # against a release whose files do not exist yet. The hook URL carries its
      # own authentication, which is why it is a secret and not a literal.
      # Without the secret (a fork) this is a no-op; with it, a POST that does
      # not report success fails the release rather than passing silently.
      - name: Rebuild kaavehdev.ir
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "SITE_DEPLOY_HOOK_URL is not set; skipping the site rebuild."
            exit 0
          fi
          response=$(curl -fsS -X POST "$HOOK")
          echo "$response"
          echo "$response" | grep -q '"success": *true' || {
            echo "Deploy hook did not report success."
            exit 1
          }
