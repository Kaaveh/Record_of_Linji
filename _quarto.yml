lang: fa-IR
dir: rtl
language: _language.yml
number-sections: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/rtl.css
    toc: true
    toc-depth: 2
    toc-title: "در این بخش"
    link-external-newwindow: true

  pdf:
    pdf-engine: lualatex
    documentclass: book
    toc-depth: 1
    classoption: [openany]
    mainfont: "Vazirmatn-Regular.ttf"
    mainfontoptions:
      - Path=fonts/
      - BoldFont=Vazirmatn-Bold.ttf
      - Renderer=Harfbuzz
    fontsize: 12pt
    geometry:
      - top=25mm
      - bottom=25mm
      - inner=28mm
      - outer=22mm
    include-in-header: tex/preamble.tex
    template-partials:
      - tex/title.tex
    colorlinks: true

  epub:
    page-progression-direction: rtl
    epub-fonts:
      - fonts/Vazirmatn-Regular.ttf
      - fonts/Vazirmatn-Bold.ttf
    css: assets/epub.css
    toc-depth: 1
