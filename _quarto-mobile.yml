# Mobile PDF flavour. `just pdf-mobile`, i.e.
# `quarto render --profile mobile --to pdf`.
# Inherits from _quarto.yml including LuaLaTeX and tex/preamble.tex.

project:
  output-dir: _book-mobile

book:
  output-file: record-of-linji-farsi-mobile

format:
  pdf:
    geometry:
      - paperwidth=90mm
      - paperheight=160mm
      - margin=6mm
      - includefoot
    classoption: [openany, oneside]
    include-in-header:
      - tex/preamble.tex
      - tex/mobile.tex
